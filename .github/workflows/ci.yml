# Lint + tests on every PR and on master (2026-11-15). Windows, because the
# app and its font rules (Malgun Gothic, docs/ui.md 8.16) are Windows-only;
# Qt runs headless. The tests need no network and no KIS keys (CLAUDE.md).
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check src
      - name: Pytest
        run: python -m pytest src/tests -q
